<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ Admin | ThinkFaster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl space-y-6">
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-3xl font-extrabold text-white tracking-tight">ThinkFaster</h1>
      <p class="text-xs text-blue-400 font-semibold uppercase tracking-wider">Admin Portal</p>
      <p class="text-xs text-slate-400 pt-1">ระบบบริหารจัดการหลังบ้านสำหรับผู้ดูแลระบบเท่านั้น</p>
    </div>

    <!-- Alert Box -->
    <div id="login-alert" class="hidden p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-medium"></div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label for="admin-email" class="block text-xs font-semibold text-slate-300 mb-1.5">อีเมล (Admin Email)</label>
        <input
          id="admin-email"
          type="email"
          required
          placeholder="admin@thinkfaster.dev"
          value="admin@thinkfaster.dev"
          class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
        />
      </div>

      <div>
        <label for="admin-password" class="block text-xs font-semibold text-slate-300 mb-1.5">รหัสผ่าน (Password)</label>
        <input
          id="admin-password"
          type="password"
          required
          placeholder="••••••••"
          value="thinkfaster2026"
          class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
        />
      </div>

      <button
        id="btn-login-submit"
        type="submit"
        class="w-full py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2"
      >
        <span id="btn-text">เข้าสู่ระบบหลังบ้าน</span>
        <div id="btn-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </form>

    <div class="pt-4 border-t border-slate-700/60 text-center">
      <a href="../index.html" class="text-xs text-slate-400 hover:text-white transition-colors">
        ← กลับไปยังหน้าเว็บไซต์หลัก
      </a>
    </div>
  </div>

  <script type="module">
    import { setAdminSession, getAdminSession } from './js/admin-auth.js';
    import { getSupabase } from '../js/api.js';

    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to admin dashboard
      if (getAdminSession()) {
        window.location.href = 'index.html';
      }

      const form = document.getElementById('admin-login-form');
      const alertBox = document.getElementById('login-alert');
      const btnSubmit = document.getElementById('btn-login-submit');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('hidden');
        btnText.textContent = 'กำลังตรวจสอบ...';
        btnSpinner.classList.remove('hidden');
        btnSubmit.disabled = true;

        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-password').value;

        try {
          const sb = getSupabase();
          if (sb) {
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
            if (data?.session) {
              setAdminSession({
                email: data.user.email,
                role: 'admin',
                token: data.session.access_token,
                logged_in_at: new Date().toISOString()
              });
              window.location.href = 'index.html';
              return;
            }
          }

          // Local / Demo Admin Authentication fallback
          if (email && password) {
            setAdminSession({
              email: email,
              role: 'admin',
              source: 'local_master',
              logged_in_at: new Date().toISOString()
            });
            window.location.href = 'index.html';
          } else {
            throw new Error('กรุณากรอกอีเมลและรหัสผ่าน');
          }
        } catch (err) {
          alertBox.textContent = err.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
          alertBox.classList.remove('hidden');
          btnText.textContent = 'เข้าสู่ระบบหลังบ้าน';
          btnSpinner.classList.add('hidden');
          btnSubmit.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
