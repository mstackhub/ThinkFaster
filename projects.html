<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบและเว็บไซต์ทั้งหมด | ThinkFaster Marketplace</title>
  <meta name="description" content="เลือกดูแคตตาล็อกระบบเว็บไซต์และเว็บแอปพลิเคชันสำเร็จรูปทั้งหมด ค้นหาตามหมวดหมู่ ทดลอง Demo สั่งซื้อง่าย">
  <link rel="canonical" href="https://thinkfaster.dev/projects.html">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

  <div id="site-header"></div>

  <!-- Page Header -->
  <section class="bg-white border-b border-slate-200/80 py-8 sm:py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="max-w-3xl">
        <nav class="flex items-center gap-2 text-xs text-slate-500 mb-3" aria-label="Breadcrumb">
          <a href="index.html" class="hover:text-blue-600 transition-colors">หน้าแรก</a>
          <span>/</span>
          <span class="text-slate-900 font-medium">ระบบทั้งหมด</span>
        </nav>
        <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
          แคตตาล็อกระบบสำเร็จรูปทั้งหมด
        </h1>
        <p class="text-sm sm:text-base text-slate-600 mt-2">
          เลือกดูระบบที่ตรงกับความต้องการ ทดลองเล่น Demo จริง และติดต่อเพื่อสั่งซื้อทันที
        </p>
      </div>
    </div>
  </section>

  <!-- Filter & Catalog Section -->
  <main class="py-8 sm:py-12 flex-1">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- Search & Filters -->
      <div class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm mb-8 space-y-4">
        <!-- Search Bar -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input
            id="project-search-input"
            type="text"
            placeholder="ค้นหาชื่อระบบ, รหัส, หรือคำค้นหา เช่น จองคิว, รถมือสอง, ร้านอาหาร, สปา..."
            class="w-full pl-11 pr-4 py-3 text-sm sm:text-base rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-white focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          />
        </div>

        <!-- Categories Filter Pill Bar -->
        <div>
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">หมวดหมู่</div>
          <div id="category-filter-list" class="flex items-center gap-2 overflow-x-auto pb-2 hide-scrollbar">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Filters Grid -->
        <div class="pt-4 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label for="project-type-select" class="block text-xs font-medium text-slate-500 mb-1">ประเภทระบบ</label>
            <select id="project-type-select" class="w-full text-xs sm:text-sm rounded-lg border border-slate-200 bg-white px-3 py-2 text-slate-700 focus:ring-2 focus:ring-blue-500">
              <option value="all">ทุกประเภท</option>
              <option value="Web Application">Web Application</option>
              <option value="Website">Website</option>
              <option value="Landing Page">Landing Page</option>
              <option value="E-Commerce">E-Commerce</option>
            </select>
          </div>

          <div>
            <label for="project-price-select" class="block text-xs font-medium text-slate-500 mb-1">ช่วงราคา</label>
            <select id="project-price-select" class="w-full text-xs sm:text-sm rounded-lg border border-slate-200 bg-white px-3 py-2 text-slate-700 focus:ring-2 focus:ring-blue-500">
              <option value="">ทุกช่วงราคา</option>
              <option value="under_2000">ต่ำกว่า 2,000 บาท</option>
              <option value="2000_5000">2,000 - 5,000 บาท</option>
              <option value="over_5000">5,000 บาทขึ้นไป</option>
            </select>
          </div>

          <div>
            <label for="project-sort-select" class="block text-xs font-medium text-slate-500 mb-1">การจัดเรียง</label>
            <select id="project-sort-select" class="w-full text-xs sm:text-sm rounded-lg border border-slate-200 bg-white px-3 py-2 text-slate-700 focus:ring-2 focus:ring-blue-500">
              <option value="recommended">แนะนำ (Recommended)</option>
              <option value="popular">ยอดนิยม (Popular)</option>
              <option value="newest">ใหม่ล่าสุด (Newest)</option>
              <option value="price_asc">ราคา: ต่ำไปสูง</option>
              <option value="price_desc">ราคา: สูงไปต่ำ</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Result Count Info -->
      <div class="flex items-center justify-between mb-6">
        <span id="projects-count" class="text-xs sm:text-sm font-semibold text-slate-500">
          กำลังค้นหาระบบ...
        </span>
      </div>

      <!-- Projects Grid -->
      <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
        <!-- Rendered dynamically -->
      </div>

      <!-- Empty State -->
      <div id="projects-empty-state" class="hidden text-center py-16 px-4 bg-white rounded-2xl border border-slate-200">
        <div class="w-16 h-16 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-4 text-2xl">
          🔍
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-1">ไม่พบระบบที่ตรงกับตัวกรอง</h3>
        <p class="text-sm text-slate-500 max-w-md mx-auto mb-6">
          ลองค้นหาด้วยคำอื่น หรือกดล้างตัวกรองทั้งหมด
        </p>
        <button
          id="btn-reset-filters"
          type="button"
          class="inline-flex items-center px-4 py-2 text-sm font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-xl transition-colors"
        >
          ล้างตัวกรองทั้งหมด
        </button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="floating-contact-container"></div>

  <script type="module" src="js/projects-page.js"></script>
</body>
</html>
